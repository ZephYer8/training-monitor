name: Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Prepare release signing
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/xunji-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/xunji-release.jks" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            gradle -p android :app:assembleRelease
            cp android/app/build/outputs/apk/release/app-release.apk training-monitor.apk
          else
            gradle -p android :app:assembleDebug
            cp android/app/build/outputs/apk/debug/app-debug.apk training-monitor.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: training-monitor-apk
          path: training-monitor.apk

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: training-monitor.apk
